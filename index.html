/* ===== NAV / FOOTER ===== */
function buildNav(p){const N=[["/","Home"],["/about","About"],["/services","Services"],["/projects","Projects"],["/industries","Industries"],["/locations","Locations"],["/contact","Contact"]];
 document.getElementById("nl").innerHTML=N.map(([h,t])=>{const a=h==="/"?p==="/":p.startsWith(h),c=a?' aria-current="page"':"";
 return h==="/services"?`<li class="dd"><div style="display:flex"><a class="nl" href="#${h}"${c}>${t}</a><button class="nl" data-dd aria-expanded="false" aria-label="Services menu" style="width:44px">▾</button></div><div class="menu">${SV.map(s=>`<a href="#/services/${s.s}">${s.n}</a>`).join("")}</div></li>`:`<li><a class="nl" href="#${h}"${c}>${t}</a></li>`}).join("")}
function footer(){document.getElementById("ft").innerHTML=`<div class="wrap"><div class="fg"><div><h3>SR Giant Projects LLP</h3><p style="font-size:.9rem">Industrial and commercial contracting in India and Tanzania.</p></div><div><h3>Services</h3><ul>${SV.map(s=>`<li><a href="#/services/${s.s}">${s.n}</a></li>`).join("")}</ul></div><div><h3>Company</h3><ul><li><a href="#/about">About</a></li><li><a href="#/projects">Projects</a></li><li><a href="#/industries">Industries</a></li><li><a href="#/locations">Locations</a></li><li><a href="#/contact">Contact</a></li></ul></div><div><h3>Contact</h3><p style="font-size:.9rem">India: <a href="tel:+${CONFIG.waIN}">${CONFIG.phIN}</a><br>Tanzania: <a href="tel:+${CONFIG.waTZ}">${CONFIG.phTZ}</a></p>${CONFIG.email?`<p><a href="mailto:${CONFIG.email}">${CONFIG.email}</a></p>`:""}</div></div><div class="cp">© ${new Date().getFullYear()} ${CONFIG.india}. · <a href="#/admin">Admin</a></div></div>`;
 document.getElementById("fo").innerHTML=`<a href="${waL(CONFIG.waIN,GEN)}" target="_blank" rel="noopener noreferrer">India · ${CONFIG.phIN}</a><a href="${waL(CONFIG.waTZ,GEN)}" target="_blank" rel="noopener noreferrer">Tanzania · ${CONFIG.phTZ}</a>`}
function renderLogo(){const i=document.getElementById("logoimg");if(i&&CONFIG.logo){i.style.display="";i.src=imgU(CONFIG.logo)}const fv=document.querySelector("link[rel=icon]");if(fv&&CONFIG.favicon)fv.href=imgU(CONFIG.favicon)}
/* ===== ROUTER (hash-based: works on any host) ===== */
function route(){const p=(location.hash.replace(/^#/,"")||"/").replace(/\/+$/,"")||"/",q=p.split("/");let pg;
 if(p==="/")pg=pages.home();else if(q[1]==="services"&&q[2])pg=service(q[2]);else if(q.length===2&&pages[q[1]]&&q[1]!=="nf"&&q[1]!=="home")pg=pages[q[1]]();else pg=pages.nf();
 document.title=pg.t;document.querySelector("meta[name=description]").content=pg.d;document.getElementById("main").innerHTML=pg.h;
 document.body.dataset.home=pg.home?1:"";buildNav(p);closeNav();window.scrollTo(0,0);top_();reveal();
 const cf=document.getElementById("cf");if(cf)cf.onsubmit=submit;
 const fl=document.getElementById("fl");if(fl)fl.onclick=e=>{const b=e.target.closest("button");if(!b)return;fl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));document.querySelectorAll("#mo .pj").forEach(c=>c.style.display=!b.dataset.f||c.dataset.t===b.dataset.f?"":"none")};
 let rb=document.querySelector("meta[name=robots]");if(p==="/admin"){if(!rb){rb=document.createElement("meta");rb.name="robots";document.head.append(rb)}rb.content="noindex";adminInit()}else if(rb)rb.remove()}
const top_=()=>document.body.classList.toggle("top",document.body.dataset.home==="1"&&scrollY<40);
function closeNav(){document.body.classList.remove("lock");const b=document.getElementById("bg");b.setAttribute("aria-expanded","false");b.textContent="☰";b.setAttribute("aria-label","Open menu")}
function reveal(){const els=document.querySelectorAll(".rv");if(!("IntersectionObserver"in window)){els.forEach(e=>e.classList.add("in"));return}const o=new IntersectionObserver(a=>a.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");o.unobserve(x.target)}}),{threshold:.12});els.forEach(e=>o.observe(e))}
document.getElementById("bg").onclick=e=>{const o=document.body.classList.toggle("lock");e.currentTarget.setAttribute("aria-expanded",o);e.currentTarget.textContent=o?"✕":"☰";e.currentTarget.setAttribute("aria-label",o?"Close menu":"Open menu")};
document.getElementById("fb").onclick=e=>{const o=document.getElementById("fab").classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",o)};
document.addEventListener("click",e=>{const d=e.target.closest("[data-dd]");if(d){const o=d.closest(".dd").classList.toggle("open");d.setAttribute("aria-expanded",o);return}if(e.target.closest("nav a"))closeNav()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeNav();document.getElementById("fab").classList.remove("open")}});
addEventListener("scroll",top_,{passive:true});addEventListener("hashchange",route);
function submit(e){e.preventDefault();const v=id=>document.getElementById(id).value.trim(),er=(id,m)=>{document.getElementById("e-"+id).textContent=m;return!m};let ok=true;
 ok=er("n",v("n")?"":"Enter your name.")&&ok;ok=er("em",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("em"))?"":"Enter a valid email.")&&ok;ok=er("ph",v("ph").replace(/\D/g,"").length>=8?"":"Enter a valid phone number.")&&ok;ok=er("ds",v("ds")?"":"Describe your project.")&&ok;if(!ok)return;
 const to=v("of")==="TZ"?CONFIG.waTZ:CONFIG.waIN;window.open(waL(to,`Hello, I would like to discuss a project.\nName: ${v("n")}\nCompany: ${v("c")||"-"}\nEmail: ${v("em")}\nPhone: ${v("ph")}\nLocation: ${v("lc")||"-"}\nService: ${v("sv")}\nProject type: ${v("pt")||"-"}\nContact via: ${v("cm")}\nDetails: ${v("ds")}`),"_blank","noopener,noreferrer")}
/* ===== ADMIN: editor + Cloudinary + GitHub ===== */
const snapshot=()=>({config:Object.fromEntries(CFG_KEYS.map(k=>[k,CONFIG[k]])),services:SV,projects:PR,industries:IN});
const draftSave=()=>localStorage.setItem("sr_draft",JSON.stringify(snapshot()));
function applyData(d){if(!d)return;if(d.config)CFG_KEYS.forEach(k=>{if(d.config[k]!=null)CONFIG[k]=d.config[k]});if(d.services)SV=d.services;if(d.projects)PR=d.projects;if(d.industries)IN=d.industries}
function adminInit(){const root=document.getElementById("adm"),COLL={services:()=>SV,projects:()=>PR,industries:()=>IN};
 let int=JSON.parse(localStorage.getItem("sr_int")||"{}"),tab=sessionStorage.getItem("sr_tab")||"services";
 const esc=s=>String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"),LN=["apps","scope"];
 const msg=(t,bad)=>{const m=document.getElementById("amsg");if(m){m.textContent=t;m.style.color=bad?"#c0392b":"#1a7f45"}};
 const val=(o,k)=>LN.includes(k)?(o[k]||[]).join("\n"):o[k];
 const FL={services:[["n","Name"],["s","URL slug"],["d","Short description","t"],["i","Overview","t"],["f","Image","img"],["apps","Applications (one per line)","t"],["scope","Scope of work (one per line)","t"],["msg","WhatsApp message (after greeting)"]],
  projects:[["n","Title"],["loc","Location"],["type","Category"],["d","Description","t"],["f","Photo","img"]],industries:[["n","Name"],["d","Description","t"],["f","Image","img"]]};
 const blank={services:()=>({s:"new-service-"+(Date.now()%10000),n:"New service",d:"",i:"",apps:[],scope:[],f:"",msg:"I would like to discuss a project."}),projects:()=>({n:"Project title",loc:"",type:"General",d:"",f:""}),industries:()=>({n:"New industry",d:"",f:""})};
 const inp=(c,k,l,v,ty="text")=>`<div class="af"><label>${l}</label><input type="${ty}" data-c="${c}" data-k="${k}" value="${esc(v)}" autocomplete="off"></div>`;
 const field=(c,i,o,[k,l,t])=>t==="img"?`<div class="af"><label>${l}</label><input data-c="${c}" data-i="${i}" data-k="${k}" value="${esc(val(o,k))}" placeholder="Image URL or file name">${/^https?:/.test(val(o,k)||"")?`<img src="${esc(val(o,k))}" alt="" style="max-height:70px;margin-top:6px">`:""}<label class="btn o sm" style="margin-top:6px">Upload to Cloudinary<input type="file" accept="image/*" hidden data-up data-c="${c}" data-i="${i}" data-k="${k}"></label></div>`
  :`<div class="af"><label>${l}</label>${t?`<textarea rows="3" data-c="${c}" data-i="${i}" data-k="${k}">${esc(val(o,k))}</textarea>`:`<input data-c="${c}" data-i="${i}" data-k="${k}" value="${esc(val(o,k))}">`}</div>`;
 function set(c,i,k,v){if(c==="int"){int[k]=v;localStorage.setItem("sr_int",JSON.stringify(int));return}
  if(c==="config"){CONFIG[k]=v;renderLogo();footer()}else{const o=COLL[c]()[+i];o[k]=LN.includes(k)?v.split("\n").map(x=>x.trim()).filter(Boolean):v}draftSave()}
 function draw(){const T=[["services","Services"],["projects","Projects"],["industries","Industries"],["settings","Settings"],["publish","Publish"]];
  let h=`<div class="atabs">${T.map(([t,l])=>`<button class="btn sm ${t===tab?"":"o"}" data-act="tab" data-t="${t}">${l}</button>`).join("")}</div><p id="amsg" role="status"></p>`;
  if(COLL[tab])h+=COLL[tab]().map((o,i)=>`<details class="ad"><summary>${esc(o.n||"Untitled")}</summary><div class="b">${FL[tab].map(f=>field(tab,i,o,f)).join("")}<div class="row"><button class="btn o sm" data-act="up" data-c="${tab}" data-i="${i}">Move up</button><button class="btn o sm" data-act="down" data-c="${tab}" data-i="${i}">Move down</button><button class="btn sm" style="background:#c0392b;border-color:#c0392b;color:#fff" data-act="del" data-c="${tab}" data-i="${i}">Remove</button></div></div></details>`).join("")+`<button class="btn" data-act="add" data-c="${tab}">Add ${tab==="industries"?"industry":tab.slice(0,-1)}</button>`;
  else if(tab==="settings")h+=`<h2>Site images</h2><div class="ag">${[["logo","Logo"],["hero","Homepage hero image"],["favicon","Favicon"]].map(([k,l])=>field("config","",CONFIG,[k,l,"img"])).join("")}</div><h2>Business details</h2><div class="ag">${[["india","India entity name"],["phIN","India phone (display)"],["waIN","India WhatsApp (digits, 91…)"],["addrIN","India address"],["tz","Tanzania entity name"],["phTZ","Tanzania phone (display)"],["waTZ","Tanzania WhatsApp (digits, 255…)"],["addrTZ","Tanzania postal info"],["email","Email (optional)"]].map(([k,l])=>inp("config",k,l,CONFIG[k])).join("")}</div>
   <h2>Cloudinary</h2><div class="ag">${inp("int","cloud","Cloud name",int.cloud)}${inp("int","preset","Unsigned upload preset",int.preset)}</div><h2>GitHub</h2><div class="ag">${inp("int","owner","Owner",int.owner)}${inp("int","repo","Repository",int.repo)}${inp("int","branch","Branch (default main)",int.branch)}${inp("int","path","Content path (default content.json)",int.path)}${inp("int","token","Access token",int.token,"password")}</div><p class="note">These settings, including the token, stay in this browser only. Use a fine-grained token limited to this repository (Contents: read and write).</p>`;
  else h+=`<h2>Publish</h2><p>Edits save as a draft in this browser. Publishing commits <code>${esc(int.path||"content.json")}</code> to GitHub; the live site reads it for all visitors after your host redeploys.</p><div class="row"><button class="btn wa" data-act="pub">Publish to GitHub</button><button class="btn o" data-act="export">Download content.json</button><button class="btn o" data-act="reset">Discard draft</button></div>`;
  root.innerHTML=h}
 async function upload(f){if(!int.cloud||!int.preset)throw Error("Add the Cloudinary cloud name and upload preset in Settings.");const fd=new FormData();fd.append("file",f);fd.append("upload_preset",int.preset);
  const r=await fetch(`https://api.cloudinary.com/v1_1/${int.cloud}/image/upload`,{method:"POST",body:fd}),j=await r.json();if(!r.ok)throw Error(j.error?.message||"Upload failed");return j.secure_url.replace("/upload/","/upload/f_auto,q_auto,w_1600/")}
 async function publish(){const br=int.branch||"main",path=int.path||"content.json";if(!int.owner||!int.repo||!int.token)return msg("Add the GitHub owner, repository and token in Settings.",1);
  const api=`https://api.github.com/repos/${int.owner}/${int.repo}/contents/${path}`,h={Authorization:"Bearer "+int.token,Accept:"application/vnd.github+json"};
  try{msg("Publishing...");let sha;const g=await fetch(`${api}?ref=${encodeURIComponent(br)}`,{headers:h});if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw Error("GitHub error "+g.status+" reading the file. Check owner, repository and token.");
   const p=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:"Update site content via admin",branch:br,sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(snapshot(),null,2))))})});if(!p.ok)throw Error("GitHub: "+((await p.json()).message||p.status));msg("Published. The live site updates once your host redeploys.")}catch(e){msg(e.message,1)}}
 root.oninput=e=>{const t=e.target;if(t.dataset.k!==undefined&&t.type!=="file")set(t.dataset.c,t.dataset.i,t.dataset.k,t.value)};
 root.onchange=async e=>{const t=e.target;if(!t.matches("[data-up]")||!t.files[0])return;msg("Uploading...");try{const u=await upload(t.files[0]);set(t.dataset.c,t.dataset.i,t.dataset.k,u);draw();msg("Image uploaded.")}catch(er){msg(er.message,1)}};
 root.onclick=e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,c=b.dataset.c,i=+b.dataset.i;
  if(a==="tab"){tab=b.dataset.t;sessionStorage.setItem("sr_tab",tab);return draw()}
  if(a==="add"){COLL[c]().push(blank[c]());draftSave();return draw()}
  if(a==="del"){if(confirm("Remove this entry?")){COLL[c]().splice(i,1);draftSave();draw()}return}
  if(a==="up"||a==="down"){const r=COLL[c](),j=a==="up"?i-1:i+1;if(j<0||j>=r.length)return;[r[i],r[j]]=[r[j],r[i]];draftSave();return draw()}
  if(a==="pub")return publish();
  if(a==="export"){const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"}));l.download="content.json";l.click();return}
  if(a==="reset"&&confirm("Discard your draft and reload published content?")){localStorage.removeItem("sr_draft");location.reload()}};
 draw()}
/* ===== INIT ===== */
(async()=>{try{const r=await fetch("content.json",{cache:"no-store"});if(r.ok)applyData(await r.json())}catch(e){}
 try{const d=localStorage.getItem("sr_draft");if(d)applyData(JSON.parse(d))}catch(e){}
 renderLogo();footer();route()})();
</script></body></html>
